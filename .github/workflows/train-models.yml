name: Train and Publish Mobile Models

on:
  push:
    branches:
      - main
    paths:
      - 'ml_pipeline/scripts/train_intent_model.py'
      - 'ml_pipeline/scripts/train_ner_model.py'
      - 'ml_pipeline/scripts/export_mobile_models.py'
      - 'ml_pipeline/nlp/**'
      - '.github/workflows/train-models.yml'

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt
          pip install spacy scikit-learn

      - name: Train Intent Model
        run: |
          echo "MODEL TRAINING: STARTED"
          python ml_pipeline/scripts/train_intent_model.py
        
      - name: Train NER Model
        run: |
          python ml_pipeline/scripts/train_ner_model.py

      - name: Verify Model Artifacts
        run: |
          if [ ! -f "ml_pipeline/data/intent_model.pkl" ]; then
            echo "Error: intent_model.pkl not found!"
            exit 1
          fi
          if [ ! -d "ml_pipeline/data/ner_model" ]; then
            echo "Error: ner_model directory not found!"
            exit 1
          fi

      - name: Generate Mobile Artifacts
        id: generate
        run: |
          # Use run number as version (e.g., v5)
          VERSION="v${{ github.run_number }}"
          echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV
          
          python ml_pipeline/scripts/export_mobile_models.py
          
          if [ ! -f "ml_pipeline/data/mobile_export/nurseassist-model-${VERSION}.zip" ]; then
            echo "Error: ZIP package not found!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Model v${{ github.run_number }}
          files: ml_pipeline/data/mobile_export/nurseassist-model-v${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

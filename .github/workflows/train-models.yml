name: Train and Publish Mobile Models

on:
  push:
    branches:
      - main
    paths:
      - 'ml_pipeline/scripts/synur_dataset.py'
      - 'ml_pipeline/scripts/train_observation_model.py'
      - 'ml_pipeline/scripts/export_mobile_models.py'
      - 'ml_pipeline/scripts/verify_mobile_export.py'
      - 'ml_pipeline/config.py'
      - 'ml_pipeline/requirements.txt'
      - '.github/workflows/train-models.yml'

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt

      - name: Train real-data nursing observation model
        run: |
          echo "SYNUR MODEL TRAINING: STARTED"
          python ml_pipeline/scripts/train_observation_model.py

      - name: Verify Model Artifacts
        run: |
          if [ ! -f "ml_pipeline/data/clinical_observation_model.pkl" ]; then
            echo "Error: clinical_observation_model.pkl not found!"
            exit 1
          fi
      - name: Generate Mobile Artifacts
        id: generate
        run: |
          VERSION="nurse-nlp-v${{ github.run_number }}"
          export MODEL_VERSION="$VERSION"
          echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV
          
          python ml_pipeline/scripts/export_mobile_models.py
          python ml_pipeline/scripts/verify_mobile_export.py
          
          if [ ! -f "ml_pipeline/data/mobile_export/nurseassist-observation-model-${VERSION}.zip" ]; then
            echo "Error: ZIP package not found!"
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nurse-nlp-v${{ github.run_number }}
          name: Nursing language model v${{ github.run_number }}
          files: ml_pipeline/data/mobile_export/nurseassist-observation-model-nurse-nlp-v${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

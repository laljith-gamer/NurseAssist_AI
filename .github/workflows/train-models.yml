name: Train ML Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm
          
      - name: Train Intent Model
        run: python backend/scripts/train_intent_model.py
        
      - name: Train NER Model
        run: python backend/scripts/train_ner_model.py
        
      - name: Validate Models
        run: |
          if [ ! -f "backend/data/intent_model.pkl" ]; then
            echo "Error: intent_model.pkl not found!"
            exit 1
          fi
          if [ ! -d "backend/data/ner_model" ]; then
            echo "Error: ner_model directory not found!"
            exit 1
          fi
          
      - name: Run Inference Sanity Tests
        run: |
          cat << 'EOF' > test_inference.py
          import sys
          import os
          sys.path.append(os.path.abspath('backend'))
          
          print("Testing Intent Model...")
          from backend.nlp.intent_classifier import IntentClassifier
          classifier = IntentClassifier()
          for text in ["BP is 120/80", "What meds are due?", "Abort", "Give patient Zofran"]:
              result = classifier.classify(text)
              print(f"'{text}' -> {result.intent.name} ({result.confidence:.2f})")
              if result.intent.name == 'UNKNOWN' and result.confidence > 0.0:
                  print("Warning: Sanity check failed, expected known intent")
                  sys.exit(1)
                  
          print("Testing NER Model...")
          from backend.nlp.entity_extractor import EntityExtractor
          extractor = EntityExtractor()
          for text in ["BP is 120/80 and heart rate is 85", "Patient temperature 38.5 degrees", "Administered Zofran 4mg"]:
              result = extractor.extract(text)
              print(f"'{text}' -> {len(result.entities)} entities")
              if len(result.entities) == 0:
                  print("Warning: Sanity check failed, expected entities")
                  sys.exit(1)
          print("Sanity checks passed.")
          EOF
          python test_inference.py

      - name: Generate Checksums & Metadata
        id: metadata
        run: |
          cat << 'EOF' > hash_generator.py
          import os
          import hashlib
          import json
          import datetime
          import time
          
          def _calculate_file_sha256(filepath):
              sha256_hash = hashlib.sha256()
              with open(filepath, "rb") as f:
                  for byte_block in iter(lambda: f.read(4096), b""):
                      sha256_hash.update(byte_block)
              return sha256_hash.hexdigest()

          def _calculate_dir_sha256(dirpath):
              sha256_hash = hashlib.sha256()
              for root, _, files in sorted(os.walk(dirpath)):
                  for file in sorted(files):
                      filepath = os.path.join(root, file)
                      with open(filepath, "rb") as f:
                           for byte_block in iter(lambda: f.read(4096), b""):
                              sha256_hash.update(byte_block)
              return sha256_hash.hexdigest()

          intent_sha = _calculate_file_sha256("backend/data/intent_model.pkl")
          ner_sha = _calculate_dir_sha256("backend/data/ner_model")
          version = f"v{int(time.time())}"
          
          metadata = {
            "version": version,
            "created_at": datetime.datetime.utcnow().isoformat() + "Z",
            "intent_model": {
              "file": "intent_model.pkl",
              "sha256": intent_sha
            },
            "ner_model": {
              "directory": "ner_model",
              "sha256": ner_sha
            },
            "metrics": {}
          }
          
          with open("backend/data/metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"VERSION={version}\n")
          EOF
          python hash_generator.py
          
      - name: Package Models
        run: |
          cd backend/data
          zip -r models.zip intent_model.pkl ner_model metadata.json
          
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Model Release ${{ env.VERSION }}
          files: backend/data/models.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

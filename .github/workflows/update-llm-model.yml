name: Update and Release LLM Model

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the release (must match the URL in the app)'
        required: true
        default: 'v1.0.0'
      model_url:
        description: 'HuggingFace model download URL'
        required: true
        default: 'https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm'
      model_filename:
        description: 'Filename to save as (must match the URL in the app)'
        required: true
        default: 'gemma-4-E2B-it.litertlm'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set!"
            exit 1
          fi
          
          echo "Downloading model from Hugging Face..."
          # Download using curl with the provided Hugging Face token
          curl -L -H "Authorization: Bearer $HF_TOKEN" \
            "${{ github.event.inputs.model_url }}" \
            -o "${{ github.event.inputs.model_filename }}"
            
          # Verify the file was downloaded successfully (check if it's larger than 1MB)
          FILESIZE=$(stat -c%s "${{ github.event.inputs.model_filename }}")
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "Error: Downloaded file is too small ($FILESIZE bytes). Token might be invalid or lacking permissions."
            cat "${{ github.event.inputs.model_filename }}"
            exit 1
          fi
          echo "Successfully downloaded $FILESIZE bytes."
            
      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          FILENAME="${{ github.event.inputs.model_filename }}"
          
          echo "Checking if release $TAG exists..."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists! Updating asset..."
            # --clobber overwrites the asset if it already exists
            gh release upload "$TAG" "$FILENAME" --clobber
          else
            echo "Creating new release $TAG and uploading asset..."
            gh release create "$TAG" "$FILENAME" \
              --title "App Release $TAG" \
              --notes "Automated model release containing $FILENAME"
          fi

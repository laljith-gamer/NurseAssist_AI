name: Release AI Model

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      release_tag:
        description: 'Tag for the release (e.g., v1.0.0-model)'
        required: true
        default: 'v1.0.0-model'

env:
  MODEL_URL: "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4-web.task"
  MODEL_FILENAME: "Gemma3-1B-IT_multi-prefill-seq_q8_ekv1280.task"

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  release-model:
    runs-on: ubuntu-latest

    steps:
      - name: Download AI Model
        run: |
          echo "Downloading AI model from ${{ env.MODEL_URL }}..."
          curl -L -o ${{ env.MODEL_FILENAME }} ${{ env.MODEL_URL }}
          echo "Download complete. File size:"
          ls -lh ${{ env.MODEL_FILENAME }}

      - name: Create GitHub Release and Upload Model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Gemma 3 1B AI Model (${{ github.event.inputs.release_tag }})"
          body: "Automated release containing the offline Gemma 3 1B AI model."
          files: ${{ env.MODEL_FILENAME }}
